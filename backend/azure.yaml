# azd project file. `azd up` reads this to build the image, push it to ACR, and
# deploy it to the Container App that the Bicep in ./infra provisions.
# See https://aka.ms/azure-dev/schema
name: alarmi-backend
metadata:
  template: alarmi-backend@0.1.0

services:
  api:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true  # image built in ACR (cloud), no local Docker daemon needed
