# Continuous deployment for the ALARMI backend.
#
# Fires on every push to main (i.e. a merged PR) that touches backend/, plus a
# manual "Run workflow" button. A service-principal logs into Azure, then runs
# the exact same backend/deploy.sh used for local deploys — one script, two
# triggers, so CI can't drift from what you run by hand.
#
# One-time setup (see backend/deploy.sh header + the repo secrets below):
#   AZURE_CREDENTIALS       — JSON from `az ad sp create-for-rbac --json-auth`
#   AZURE_SUBSCRIPTION_ID   — the Azure for Students subscription guid
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}   # manual trigger from the Actions tab

# Never run two deploys at once; let an in-flight one finish rather than cancel.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RG: rg-alarmi
      APP: alarmi-api
    steps:
      - uses: actions/checkout@v4

      # Logs the runner's `az` into Azure as the service principal. The runner's
      # preinstalled az then drives `az acr build` (server-side, no Docker) and
      # `az containerapp update` from within deploy.sh.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build + deploy
        working-directory: backend
        run: ./deploy.sh
