# Redeploys the backend to Cloud Run on push to main — only when backend/ changed.
#
# Ships code only. Env vars, the Cloud SQL connection, the bucket, and scaling
# were set on the service at first deploy (backend/deploy.sh) and persist across
# revisions, so no secrets beyond the deploy credentials are needed here. To
# change that config, rerun deploy.sh locally.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY       — JSON key of a service account with run.admin,
#                      cloudbuild.builds.editor, artifactregistry.writer,
#                      storage.admin, iam.serviceAccountUser
#   GCP_PROJECT_ID   — alarmi-fa0c6
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy alarmi-api \
            --source backend \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region us-east1 \
            --quiet
